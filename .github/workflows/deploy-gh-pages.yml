name: Build the site and deploy to GitHub pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tutorials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Checkout (theme)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MunifTanjim/minimo
          # repository: falkmielke/minimo
          # ref: update_202605
          path: themes/minimo

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          # extended: true

      - name: Build
        run: hugo

      # Need to add post build for the search functionality...
      - name: Install JS dependencies to build the index
        run: npm install lunr glob

      - name: Generate search index
        run: node themes/minimo/scripts/generate-search-index-lunr.js

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # 4.9.0
        with:
          branch: gh-pages
          folder: public
