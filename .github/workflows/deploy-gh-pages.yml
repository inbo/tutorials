name: Build the site and deploy to GitHub pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tutorials)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Checkout (theme)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: MunifTanjim/minimo
          ref: v2.9.0
          path: themes/minimo

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d # v2
        with:
          hugo-version: '0.88.1'
          # extended: true

      - name: Build
        run: hugo

      # Need to add post build for the search functionality...
      - name: Install JS dependencies to build the index
        run: npm install lunr glob

      - name: Generate search index
        run: node themes/minimo/scripts/generate-search-index-lunr.js

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # 4.8.0
        with:
          branch: gh-pages
          folder: public
